<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Bootstrap Navbars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The Boardroom-->
    <div class="container-fluid px-0">
        <nav class="navbar navbar-expand-lg bg-gradient">
            <div class="container">
                <ul class="nav justify-content-start">
                    <li class="nav-item">
                        <a class="navbar-brand">
                            <i class="bi bi-instagram"></i>
                        </a>
                    </li>
                </ul>

                <ul class="nav justify-content-center">
                    <li class="nav-item">
                        <a class="navbar-brand" href="#">
                            <img src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-bootstrap-navbars-board-room-logo.png" alt="The Boardroom Logo">
                        </a>
                    </li>
                </ul>

                <ul class="nav justify-content-end">
                    <li class="nav-item">
                        <button class="btn btn-dark">Menu</button>
                    </li>
                </ul>
            </div>
        </nav>
    </div>

    <!-- Morning Brew-->
     <div>
        <nav class="navbar navbar-expand-lg bg-light">
            <div class="py-2 container">
                <div class="mx-auto navbar-nav">
                    <img src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-bootstrap-navbars-morning-brew-logo.png" alt="Morning Brew Logo">
                </div>
            </div>
        </nav>

        <div class="navbar navbar-expand-lg bg-light sticky-top">
            <div class="container">
                <div class="mx-auto navbar-nav">
                    <div class="nav-item border-1 border-top border-dark">
                        Home
                    </div>

                    <div class="nav-item border-1 border-top border-dark">
                        Order Online
                    </div>

                    <div class="nav-item border-1 border-top border-dark">
                        Menus
                    </div>

                    <div class="nav-item border-1 border-top border-dark">
                        Locations
                    </div>

                    <div class="nav-item border-1 border-top border-dark">
                        About
                    </div>

                    <div class="nav-item border-1 border-top border-dark">
                        Shop
                    </div>

                    <div class="nav-item border-1 border-top border-dark">
                        Contact
                    </div>
                </div>
            </div>
        </div>

        <!-- Buzz's-->
         <div class="container-fluid px-0">
            <nav class="navbar navbar-expand-lg bg-gradient">
                <div class="py-3 container">
                    <ul class="nav justify-content-start">
                        <li class="nav-item px-2">
                            <h4>LUNCH</h4>
                        </li>

                        <li class="nav-item px-2">
                            <h4>DINNER</h4>
                        </li>

                        <li class="nav-item px-2">
                            <h4>DRINKS &amp; PUPU</h4>
                        </li>
                    </ul>

                    <ul class="nav justify-content-center">
                        <li class="nav-item">
                            <img src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-bootstrap-navbars-buzzs-logo.png" alt="Buzz's Logo" height="70px">
                        </li>
                    </ul>

                    <ul class="nav justify-content-end">
                        <li class="nav-item">
                            <h4>ABOUT</h4>
                        </li>

                        <li class="nav-item">
                            <h4>LOCATION</h4>
                        </li>

                        <li class="nav-item">
                            <h4>SHOP</h4>
                        </li>

                        <li class="nav-item">
                            <h4>
                                <i class="bi bi-cart"></i>
                            </h4>
                        </li>
                    </ul>
                </div>
            </nav>
         </div>

         <!--  Aloha Beer-->
           <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-bootstrap-navbars-aloha-beer-logo.png" alt="Aloha Beer Logo" width="110">

                    <div class="nav justify-content-center">
                        <a class="nav-link" href="#">Locations &amp; Menus</a>
                        <a class="nav-link" href="#">Events</a>
                        <a class="nav-link" href="#">Brewery</a>
                        <a class="nav-link aloha-shop" href="#">Shop</a>
                    </div>

                    <div class="nav justify-content-end">
                        <a class="nav-link" href="#">Account</a>
                        <a class="nav-link" href="#">
                            <i class="bi bi-search"></i> Search
                        </a>
                        <a class="nav-link" href="#">
                            <i class="bi bi-cart3"></i> Cart
                        </a>
                    </div>
                </a>
            </div>
           </nav>

        <!-- Duke's Waikiki-->
         <div class="container-fluid dukes-navbar">
            <nav class="navbar">
                <div class="container">
                    <ul class="nav justify-content-start">
                        <li class="nav-item">
                            <a class="navbar-brand" href="#">
                                <img src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-bootstrap-navbars-dukes-logo.png" alt="Duke's Waikiki Logo" width="200">
                            </a>
                        </li>
                    </ul>

                    <ul class="nav justify-content-end">
                        <li class="nav-item">
                            <a class="nav-link" href="#">MENUS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">DUKE</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">SHOP</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">JOIN OUR TEAM</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">CONTACT</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link takeout" href="#">ORDER TAKEOUT &amp; DELIVERY</a>
                        </li>
                    </ul>
                </div>
            </nav>
         </div>
     </div>
</body>
</html>
